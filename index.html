<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Marco Bidoia</title>

  <meta name="description" content="Marco Bidoia — Ph.D. Candidate in Economics at Ca' Foscari University of Venice. Research in time-series econometrics, extreme value theory, environmental statistics, and score-driven models for climate and financial extremes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-page: #0d1117;
      --bg-surface: #141922;
      --bg-surface-hover: #1b2230;
      --text-main: #e6edf3;
      --text-muted: #9da7b3;
      --text-light: #768390;
      --accent: #6ea8fe;
      --accent-hover: #9ec5fe;
      --accent-soft: rgba(110, 168, 254, 0.14);
      --border: #262e3d;
      --font-serif: 'Source Serif 4', Georgia, Cambria, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --max-width: 1060px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      background-color: #0d1117 !important;
      color: #e6edf3 !important;
    }

    html, body {
      background-color: #0d1117 !important;
      color: #e6edf3 !important;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Fixed background layer strictly behind all foreground content (Active across ALL tabs) */
    .bg-distributions {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: #0d1117;
      display: block;
    }

    .dist-float {
      position: absolute;
      opacity: 0.21;
      fill: none;
      pointer-events: none;
    }

    .dist-float.dist-mid {
      opacity: 0.14;
    }

    .dist-float text {
      font-family: 'Source Serif 4', Georgia, serif;
      font-style: italic;
      font-size: 10.5px;
      stroke: none;
    }

    .formula-float {
      position: absolute;
      font-family: 'Source Serif 4', Georgia, serif;
      font-style: italic;
      opacity: 0.20;
      user-select: none;
      white-space: nowrap;
      letter-spacing: 0.01em;
      pointer-events: none;
    }

    .formula-float.formula-mid {
      opacity: 0.14;
    }

    .formula-float .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: 0.78em;
      line-height: 1.08;
      margin: 0 0.16em;
    }

    .formula-float .frac > span:first-child {
      border-bottom: 1px solid currentColor;
      padding: 0 0.2em 1px;
    }

    .formula-float .frac > span:last-child {
      padding: 1px 0.2em 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Sticky Top Navigation above background layer */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #262e3d;
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.95rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .site-brand {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .site-brand:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .nav-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.2rem 0;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-tab:hover, .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Main two-column page container above background distributions */
    .page-container {
      position: relative;
      z-index: 2;
      max-width: 1060px;
      margin: 2.5rem auto 4rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 3.25rem;
      align-items: start;
    }

    /* Left Profile Sidebar */
    .sidebar {
      position: sticky;
      top: 5.2rem;
      z-index: 3;
    }

    .avatar-wrap {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--border);
      margin-bottom: 1.15rem;
      background-color: var(--bg-surface);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .author-name {
      font-family: var(--font-serif);
      font-size: 1.48rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      color: var(--text-main);
      line-height: 1.25;
    }

    .author-role {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin: 0 0 0.95rem;
      line-height: 1.45;
    }

    .author-meta {
      list-style: none;
      padding: 0;
      margin: 0 0 1.25rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .author-meta li {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      margin-bottom: 0.5rem;
    }

    .author-meta svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 3px;
      color: var(--accent);
    }

    .sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.48rem 0.85rem;
      font-size: 0.88rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(20, 25, 34, 0.94);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn-link:hover {
      background: var(--bg-surface-hover);
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }

    .btn-link svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--accent);
    }

    /* Main Content Area */
    .main-content {
      position: relative;
      z-index: 3;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .main-content h1 {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      margin: 0 0 1rem;
      color: #fde68a;
